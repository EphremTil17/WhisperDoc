name: flutter_client
description: "WhisperDoc Native Windows Client"
publish_to: "none"
version: 3.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  win32: ^6.4.0
  ffi: ^2.1.4
  provider: ^6.1.5+1
  web_socket_channel: ^3.0.3
  window_manager: ^0.7.0
  record: ^7.2.0
  path: ^1.9.0
  path_provider: ^2.1.5
  logger: ^2.6.2
  shared_preferences: ^2.5.4
  get_it: ^9.2.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.1

  # Security Dependencies
  flutter_secure_storage: ^11.2.0
  device_info_plus: ^13.3.0
  crypto: ^3.0.6
  drift: ^2.27.0
  encrypt: ^5.0.3
  flutter_web_auth_2: ^6.0.0
  jwt_decoder: ^2.0.1
  http: ^1.6.0
  http_parser: ^4.1.0
  characters: ^1.3.0

  material_ui: any
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  stream_channel: ^2.1.4
  drift_dev: ^2.27.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico
    - assets/auth/
    - assets/audio/
    - assets/fonts/Lexend-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  # Bundled so text never depends on a runtime download and always renders
  # with the same metrics the type scale was designed against.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
