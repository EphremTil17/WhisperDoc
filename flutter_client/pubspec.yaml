name: flutter_client
description: "WhisperDoc Native Windows Client"
publish_to: 'none'
version: 2.22.2+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  win32: ^5.15.0
  ffi: ^2.1.4
  provider: ^6.1.5+1
  web_socket_channel: ^3.0.3
  system_tray: ^2.0.3
  window_manager: ^0.5.1
  record: ^6.1.2
  path_provider: ^2.1.5
  logger: ^2.6.2
  google_fonts: ^7.0.1
  shared_preferences: ^2.5.4
  get_it: ^9.2.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.1
  
  # Security Dependencies
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.2.0
  crypto: ^3.0.6
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  encrypt: ^5.0.3
  flutter_web_auth_2: ^5.0.0
  jwt_decoder: ^2.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico
    - assets/auth/
    - assets/audio/
