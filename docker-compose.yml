services:
  whisper-backend:
    image: whisperdoc-backend:${WHISPER_DOC_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.${ASR_ENGINE:-whisper}
      args:
        - API_PORT=${API_PORT:-9989}
        - VERSION=${WHISPER_DOC_VERSION:?No VERSION set. Check .env file.}
    ports:
      - "127.0.0.1:${API_PORT:-9989}:${API_PORT:-9989}"
    environment:
      - TZ=UTC
      - WHISPER_DOC_VERSION=${WHISPER_DOC_VERSION:?No VERSION set. Check .env file.}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - API_PORT=${API_PORT:-9989}
      - API_HOST=${API_HOST:-0.0.0.0}
      - ASR_ENGINE=${ASR_ENGINE:-whisper}
      - MODEL_NAME=${MODEL_NAME:-large-v3-turbo}
      - MODEL_DEVICE=${MODEL_DEVICE:-cuda}
      - MODEL_COMPUTE_TYPE=${MODEL_COMPUTE_TYPE:-float16}
      - PARAKEET_MODEL_NAME=${PARAKEET_MODEL_NAME:-nvidia/parakeet-tdt-0.6b-v2}
      - PARAKEET_DEVICE=${PARAKEET_DEVICE:-cuda}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MPLCONFIGDIR=/tmp/matplotlib
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - NUMEXPR_MAX_THREADS=16
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WHISPER_DOC_API_KEY=${WHISPER_DOC_API_KEY:?No API KEY set. Configure WHISPER_DOC_API_KEY in .env.}
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          cpus: '2'
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./model-cache:/app/model-cache
      - ./assets:/app/assets
      - ./backend/tests:/app/tests
    read_only: true
    tmpfs:
      - /tmp:nosuid,nodev
    restart: unless-stopped
    env_file:
      - ./backend/.env.template
      - .env

  whisper-test:
    image: whisperdoc-whisper-test:${WHISPER_DOC_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.whisper
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./assets:/app/assets
      - ./backend/tests:/app/tests
    command: [ "python3", "tests/test_whisper.py" ]

    profiles:
      - test
    env_file:
      - ./backend/.env.template
      - .env
