services:
  whisper-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - API_PORT=${API_PORT:-9989}
        - VERSION=${WHISPER_DOC_VERSION:?No VERSION set. Check .env file.}
    ports:
      - "${API_PORT:-9989}:${API_PORT:-9989}"
    environment:
      - TZ=UTC
      - WHISPER_DOC_VERSION=${WHISPER_DOC_VERSION:?No VERSION set. Check .env file.}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - API_PORT=${API_PORT:-9989}
      - API_HOST=${API_HOST:-0.0.0.0}
      - MODEL_NAME=${MODEL_NAME:-medium.en}
      - MODEL_DEVICE=${MODEL_DEVICE:-cuda}
      - MODEL_COMPUTE_TYPE=${MODEL_COMPUTE_TYPE:-float16}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WHISPER_DOC_API_KEY=${WHISPER_DOC_API_KEY:?No API KEY set. Configure WHISPER_DOC_API_KEY in .env.}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./model-cache:/app/model-cache
      - ./assets:/app/assets
      - ./backend/tests:/app/tests
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    env_file:
      - ./backend/.env.template
      - .env

  whisper-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./assets:/app/assets
      - ./backend/tests:/app/tests
    command: [ "python3", "tests/test_whisper.py" ]

    profiles:
      - test
    env_file:
      - ./backend/.env.template
      - .env
