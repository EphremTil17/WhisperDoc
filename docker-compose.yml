services:
  whisper-backend:
    # Engine-qualified tags keep Whisper and Parakeet API builds independent.
    image: ${BACKEND_IMAGE_NAME:-whisperdoc-backend}:${WHISPER_DOC_VERSION:-latest}-${ASR_ENGINE:-whisper}
    build:
      context: ./backend
      dockerfile: Dockerfile.${ASR_ENGINE:-whisper}
      args:
        - API_PORT=${API_PORT:-9989}
        - VERSION=${WHISPER_DOC_VERSION:?No VERSION set. Check .env file.}
    ports:
      - "127.0.0.1:${API_PORT:-9989}:${API_PORT:-9989}"
    environment:
      - TZ=UTC
      - WHISPER_DOC_VERSION=${WHISPER_DOC_VERSION:?No VERSION set. Check .env file.}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - API_PORT=${API_PORT:-9989}
      - API_HOST=${API_HOST:-0.0.0.0}
      - ASR_ENGINE=${ASR_ENGINE:-whisper}
      - MODEL_NAME=${MODEL_NAME:-large-v3-turbo}
      - MODEL_DEVICE=${MODEL_DEVICE:-cuda}
      - MODEL_COMPUTE_TYPE=${MODEL_COMPUTE_TYPE:-float16}
      - PARAKEET_BASE_URL=${PARAKEET_BASE_URL:-http://parakeet:8080}
      - PARAKEET_CONNECT_TIMEOUT_SECONDS=${PARAKEET_CONNECT_TIMEOUT_SECONDS:-2}
      - PARAKEET_REQUEST_TIMEOUT_SECONDS=${PARAKEET_REQUEST_TIMEOUT_SECONDS:-30}
      - PARAKEET_STARTUP_TIMEOUT_SECONDS=${PARAKEET_STARTUP_TIMEOUT_SECONDS:-120}
      - PARAKEET_WARMUP_SECONDS=${PARAKEET_WARMUP_SECONDS:-10}
      - PARAKEET_MAX_AUDIO_SECONDS=${PARAKEET_MAX_AUDIO_SECONDS:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WHISPER_DOC_API_KEY=${WHISPER_DOC_API_KEY:?No API KEY set. Configure WHISPER_DOC_API_KEY in .env.}
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          cpus: '2'
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./model-cache:/app/model-cache
      - ./assets:/app/assets
      - ./backend/tests:/app/tests
    read_only: true
    tmpfs:
      - /tmp:nosuid,nodev
    restart: unless-stopped
    env_file:
      - ./backend/.env.template
      - .env
    depends_on:
      parakeet:
        condition: service_healthy
        required: false

  parakeet:
    image: ${PARAKEET_IMAGE:-ghcr.io/mudler/parakeet.cpp-server@sha256:dfbe0fa76a49386b5dd413392b74c89bc68fcac0a445dbb4efec083d7dc1acbf}
    profiles:
      - parakeet
    command:
      - --model
      - /models/${PARAKEET_MODEL_FILE:-tdt-0.6b-v2-f16.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --threads
      - ${PARAKEET_THREADS:-4}
    environment:
      # Keep WhisperDoc's public variable distinct from parakeet.cpp's native
      # variable. Retired deployments used PARAKEET_DEVICE=cuda, which
      # parakeet.cpp interprets as invalid and silently falls back to CPU.
      - PARAKEET_DEVICE=${PARAKEET_ACCELERATOR:-CUDA0}
    expose:
      - "8080"
    volumes:
      - ./model-cache/parakeet:/models:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      start_period: 30s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          cpus: '2'
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:nosuid,nodev
    restart: unless-stopped

  whisper-test:
    image: whisperdoc-whisper-test:${WHISPER_DOC_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.whisper
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./assets:/app/assets
      - ./backend/tests:/app/tests
    command: [ "python3", "tests/test_whisper.py" ]

    profiles:
      - test
    env_file:
      - ./backend/.env.template
      - .env
