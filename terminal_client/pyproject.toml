[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperdoc-terminal"
version = "3.0.0"
description = "Fallback and diagnostic Python terminal client for WhisperDoc."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama~=0.4.6",
    "keyring~=25.7.0",
    "loguru~=0.7.3",
    "numpy~=2.4.3",
    "pynput~=1.8.1",
    "pyperclip~=1.11.0",
    "python-dotenv~=1.2.2",
    "requests~=2.33.0",
    "sounddevice~=0.5.5",
    "websockets~=16.0",
]

[project.scripts]
whisperdoc-terminal = "whisper_shell.client:main"

[tool.uv]
# Floors for transitive dependencies carrying known CVEs:
# urllib3<-requests, cryptography<-secretstorage (keyring on Linux).
constraint-dependencies = [
    "urllib3>=2.7.0",        # GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j
    "cryptography>=48.0.1",  # GHSA-537c-gmf6-5ccf (bundled OpenSSL), GHSA-p423-j2cm-9vmq
    "idna>=3.15",            # GHSA-65pc-fj4g-8rjx (idna.encode ReDoS; incomplete CVE-2024-3651 fix)
    "pygments>=2.20.0",      # GHSA-qfpq-jrcy-v2v9 (Low)
]

[dependency-groups]
dev = [
    "pyright",
    "pytest>=9.0.3",  # GHSA-6w46-j5rx-g56g (insecure /tmp/pytest-of-* perms)
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["whisper_shell*"]

[tool.pyright]
include = ["whisper_shell"]
exclude = [
    "tests",
    "venv",
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
exclude = [
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["whisper_shell"]
omit = ["whisper_shell/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
