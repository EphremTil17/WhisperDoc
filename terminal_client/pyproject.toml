[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperdoc-terminal"
version = "3.2.0"
description = "Fallback and diagnostic Python terminal client for WhisperDoc."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama~=0.4.6",
    "keyring~=25.7.0",
    "loguru~=0.8.0",
    "numpy~=2.5.5",
    "pynput~=1.8.2",
    "pyperclip~=1.11.0",
    "python-dotenv~=1.2.4",
    "requests~=2.34.2",
    "sounddevice~=0.5.6",
    "websockets~=17.4",
]

[project.scripts]
whisperdoc-terminal = "whisper_shell.client:main"

[tool.uv]
# Floors for transitive dependencies carrying known CVEs:
# urllib3/certifi<-requests, cryptography<-secretstorage (keyring on Linux).
constraint-dependencies = [
    "urllib3>=2.8.0",        # GHSA-8988-9cw3-xx77, GHSA-vxq7-64xx-v4gw, GHSA-gh4c-6fx4-qh6g
    "certifi>=2026.10.18",   # GHSA-6q48-6c7w-9gw2 (compromised emSign roots)
    "cryptography>=50.0.0",  # GHSA-g6cj-pr64-35w5 (PKCS#7 Bleichenbacher oracle)
    "idna>=3.15",            # GHSA-65pc-fj4g-8rjx (idna.encode ReDoS; incomplete CVE-2024-3651 fix)
    "pygments>=2.20.0",      # GHSA-qfpq-jrcy-v2v9 (Low)
]

[dependency-groups]
dev = [
    "pyright",
    "pytest>=9.0.3",  # GHSA-6w46-j5rx-g56g (insecure /tmp/pytest-of-* perms)
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["whisper_shell*"]

[tool.pyright]
include = ["whisper_shell"]
exclude = [
    "tests",
    "venv",
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
exclude = [
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Explicit because pre-commit runs ruff from the repo root with --config, and
# ruff then resolves first-party detection against the CWD.
known-first-party = ["whisper_shell", "tests"]

[tool.coverage.run]
source = ["whisper_shell"]
omit = ["whisper_shell/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
