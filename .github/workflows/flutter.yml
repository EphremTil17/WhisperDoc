name: Flutter client

on:
  push:
    branches: ["**"]
    paths:
      - "flutter_client/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, analyze, test, build (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Resolve dependencies from the lockfile
        run: flutter pub get --enforce-lockfile

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Compiles the native Win32 runner (audio device watcher, window setup)
      # that unit tests never touch. No dart-defines: nothing here is shipped.
      - name: Release build
        run: flutter build windows --release
