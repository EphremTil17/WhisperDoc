    { name = "orjson", specifier = "~=3.11.7" },
    { name = "pyjwt", extras = ["crypto"], specifier = "~=2.10" },
    { name = "python-multipart", specifier = "~=0.0.30" },
    { name = "requests", specifier = "~=2.33.0" },
    { name = "torch", marker = "extra == 'whisper'", index = "https://download.pytorch.org/whl/cpu", conflict = { package = "whisperdoc-backend", extra = "whisper" } },
