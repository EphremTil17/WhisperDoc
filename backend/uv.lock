    { name = "cachetools", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "fastapi", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "loguru", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "orjson", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "pyjwt", extra = ["crypto"], marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "python-multipart", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "requests", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "uvicorn", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "uvloop", marker = "sys_platform == 'linux'" },
    { name = "websockets", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[package.optional-dependencies]
whisper = [
    { name = "ctranslate2", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "faster-whisper", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "nvidia-cublas-cu12", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "nvidia-cudnn-cu12", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "torch", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[package.dev-dependencies]
dev = [
    { name = "httpx2", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "numpy", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "pyright", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "pytest", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "pytest-asyncio", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "pytest-cov", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "ruff", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[package.metadata]
requires-dist = [
    { name = "cachetools", specifier = "~=7.0.5" },
    { name = "ctranslate2", marker = "extra == 'whisper'", specifier = "~=4.7.1" },
