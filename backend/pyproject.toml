[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperdoc-backend"
version = "3.0.0"
description = "WhisperDoc backend service with pluggable Whisper and Parakeet ASR engines."
requires-python = ">=3.12"
dependencies = [
    "cachetools~=7.0.5",
    "fastapi~=0.138.2",
    "loguru~=0.7.3",
    "orjson~=3.11.7",
    "pyjwt[crypto]~=2.10",
    "python-multipart~=0.0.30",
    "requests~=2.33.0",
    'uvloop~=0.22.1; sys_platform != "win32"',
    "uvicorn~=0.42.0",
    "websockets~=16.0",
]

[project.optional-dependencies]
whisper = [
    "ctranslate2~=4.7.1",
    "faster-whisper~=1.2.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "torch",
]
[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest==9.0.3",  # GHSA-6w46-j5rx-g56g (insecure /tmp/pytest-of-* perms)
    "pytest-asyncio==1.3.0",
    "pytest-cov>=6.0",
    # Starlette 1.x TestClient uses httpx2 (httpx is deprecated for it).
    "httpx2>=2.0.0",
    "numpy",
]

[tool.setuptools]
py-modules = ["api_server", "logging_config"]

[tool.setuptools.packages.find]
include = ["auth*", "engine*", "protocol*", "security*"]
exclude = ["tests*"]

[tool.uv]
default-groups = ["dev"]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
# Floors for transitive dependencies carrying known CVEs. These packages are not
# imported directly; they arrive via the web stack (starlette<-fastapi,
# urllib3<-requests, cryptography<-pyjwt/torch).
# We pin the floor to the first patched release and leave the ceiling to each
# parent so the resolver still tracks the latest compatible version.
constraint-dependencies = [
    "starlette>=1.3.1",      # GHSA-82w8-qh3p-5jfq, GHSA-wqp7-x3pw-xc5r, GHSA-x746-7m8f-x49c, GHSA-86qp-5c8j-p5mr
    "urllib3>=2.7.0",        # GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j
    "cryptography>=48.0.1",  # GHSA-537c-gmf6-5ccf (bundled OpenSSL), GHSA-p423-j2cm-9vmq
    "pygments>=2.20.0",      # GHSA-qfpq-jrcy-v2v9 (Low)
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "whisper" }]

[tool.pyright]
include = ["."]
extraPaths = [".."]
exclude = [
    ".venv",
    "venv",
    "**/__pycache__",
    "**/node_modules",
    "**/.*"
]

venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
exclude = [
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api_server.py" = ["E402"]
