[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperdoc-backend"
version = "2.24.7"
description = "WhisperDoc backend service with pluggable Whisper and Parakeet ASR engines."
requires-python = ">=3.12"
dependencies = [
    "cachetools~=7.0.5",
    "fastapi~=0.135.2",
    "loguru~=0.7.3",
    "orjson~=3.11.7",
    "python-jose[cryptography]~=3.5.0",
    "python-multipart~=0.0.22",
    "requests~=2.33.0",
    'uvloop~=0.22.1; sys_platform != "win32"',
    "uvicorn~=0.42.0",
    "websockets~=16.0",
]

[project.optional-dependencies]
whisper = [
    "ctranslate2~=4.7.1",
    "faster-whisper~=1.2.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "torch",
]
parakeet = [
    "nemo_toolkit[asr]~=2.7.2",
    "soundfile~=0.13.1",
    "torch",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=6.0",
]

[tool.setuptools]
py-modules = ["api_server", "logging_config"]

[tool.setuptools.packages.find]
include = ["auth*", "engine*", "protocol*", "security*"]
exclude = ["tests*"]

[tool.uv]
default-groups = []
environments = ["sys_platform == 'linux'"]
conflicts = [
    [
        { extra = "whisper" },
        { extra = "parakeet" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "whisper" }]

[tool.pyright]
include = ["."]
exclude = [
    ".venv",
    "venv",
    "**/__pycache__",
    "**/node_modules",
    "**/.*"
]

venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
exclude = [
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api_server.py" = ["E402"]
